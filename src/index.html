<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8">
  <title>Starplex | Cinema em Brasília: filmes em cartaz, sessões e ingressos</title>
  <base href="/Starplex/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="Gustavo Martins Gripaldi">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f0b1a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <!-- Reveal bootstrap before first paint. Fallback shows everything if JS never boots. -->
  <script>
    (function () {
      var c = document.documentElement.classList;
      c.add('js');
      setTimeout(function () { if (!c.contains('reveal-ready')) c.add('reveal-all'); }, 3000);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
